<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Membros</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #4F7DFF;
            --secondary-purple: #6B5FD9;
            --accent-teal: #5EC4D7;
            --dark-bg: #0F1419;
            --card-bg: #1A1F2E;
            --text-white: #FFFFFF;
            --text-light: #D1D5E0;
            --text-muted: #8B92A5;
            --border-light: #2A3040;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a2e 50%, var(--dark-bg) 100%);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(79, 125, 255, 0.05) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 80%, rgba(107, 95, 217, 0.05) 0%, transparent 40%),
                radial-gradient(ellipse at 40% 20%, rgba(94, 196, 215, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 60px 70px, #fff, rgba(0, 0, 0, 0)),
                radial-gradient(1px 1px at 50px 50px, #fff, rgba(0, 0, 0, 0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 90px 10px, #fff, rgba(0, 0, 0, 0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 1;
            flex: 1;
        }

        /* ===== SECTIONS ===== */
        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== LOGIN SECTION ===== */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-light);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .login-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .login-subtitle a {
            color: inherit;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .login-subtitle a:hover {
            color: var(--accent-teal);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-light);
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-white);
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
            background: rgba(79, 125, 255, 0.1);
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-purple));
            color: var(--text-white);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 125, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(79, 125, 255, 0.1);
            color: var(--primary-blue);
            border: 1px solid var(--primary-blue);
        }

        .btn-secondary:hover {
            background: rgba(79, 125, 255, 0.2);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            border: 1px solid var(--border-light);
            padding: 0.75rem 1.5rem;
            width: auto;
            margin-top: 1.5rem;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .toggle-form {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.9rem;
        }

        .toggle-form a {
            color: var(--primary-blue);
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-form a:hover {
            text-decoration: underline;
        }

        .error-message, .success-message {
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            color: #51cf66;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .error-message.show, .success-message.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== AULAS SECTION ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-light);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-emoji {
            font-size: 2.5rem;
        }

        .title-text h1 {
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
        }

        .title-text p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .course-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .course-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-blue);
            box-shadow: 0 12px 32px rgba(79, 125, 255, 0.15);
        }

        .course-image {
            font-size: 3.5rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(79, 125, 255, 0.1), rgba(107, 95, 217, 0.1));
            text-align: center;
        }

        .course-body {
            padding: 1.5rem;
        }

        .course-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .course-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .course-meta {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        /* ===== AULA DETAIL SECTION ===== */
        .aula-header {
            margin-bottom: 2rem;
        }

        .aula-header h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .aula-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .video-container {
            width: 100%;
            margin-bottom: 2rem;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-light);
        }

        .video-container iframe,
        .video-container video {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 16 / 9;
        }

        .rating-section {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            margin-bottom: 2rem;
        }

        .rating-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .stars-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .star {
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            filter: grayscale(100%);
        }

        .star:hover, .star.active {
            filter: grayscale(0%);
            transform: scale(1.1);
        }

        .rating-text {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .comments-section {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            margin-bottom: 2rem;
        }

        .comments-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .comment-form {
            margin-bottom: 1.5rem;
        }

        .comment-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .comment-button {
            margin-top: 0.75rem;
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-purple));
            color: var(--text-white);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .comment-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 125, 255, 0.3);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .comment-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            border-left: 3px solid var(--primary-blue);
        }

        .comment-user {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .comment-text {
            color: var(--text-light);
            line-height: 1.5;
        }

        .comment-time {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .login-card {
                padding: 1.5rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .courses-grid {
                grid-template-columns: 1fr;
            }

            .aula-header h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="loginSection" class="section active">
            <div class="login-container">
                <div class="login-card">
                    <h1 class="login-title" id="platformaNome">Plataforma de Aulas</h1>
                    <p class="login-subtitle">By: <a href="https://instagram.com/izaqads" target="_blank" style="color: inherit; text-decoration: none; font-weight: 500; cursor: pointer;">@izaqads</a></p>

                    <!-- LOGIN FORM -->
                    <div id="loginForm">
                        <div id="loginError" class="error-message"></div>

                        <div class="form-group">
                            <label for="loginEmail">Email</label>
                            <input type="email" id="loginEmail" placeholder="seu@email.com">
                        </div>

                        <div class="form-group">
                            <label for="loginPassword">Senha</label>
                            <input type="password" id="loginPassword" placeholder="Sua senha">
                        </div>

                        <button class="btn btn-primary" onclick="handleLogin()">Entrar</button>

                        <div class="toggle-form">
                            Não tem conta? <a onclick="toggleForm()">Registre-se</a>
                        </div>

                        <button class="btn btn-secondary" onclick="toggleRecuperacao()" style="margin-top: 1rem;">🔐 Recuperar Senha</button>
                    </div>

                    <!-- REGISTER FORM -->
                    <div id="registerForm" style="display: none;">
                        <div id="registerError" class="error-message"></div>

                        <div class="form-group">
                            <label for="registerName">Nome</label>
                            <input type="text" id="registerName" placeholder="Seu nome">
                        </div>

                        <div class="form-group">
                            <label for="registerEmail">Email</label>
                            <input type="email" id="registerEmail" placeholder="seu@email.com">
                        </div>

                        <div class="form-group">
                            <label for="registerPassword">Senha</label>
                            <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres">
                        </div>

                        <div class="form-group">
                            <label for="registerConfirmPassword">Confirmar Senha</label>
                            <input type="password" id="registerConfirmPassword" placeholder="Confirme sua senha">
                        </div>

                        <button class="btn btn-primary" onclick="handleRegister()">Criar Conta</button>

                        <div class="toggle-form">
                            Já tem conta? <a onclick="toggleForm()">Faça login</a>
                        </div>
                    </div>

                    <!-- PASSWORD RESET FORM -->
                    <div id="resetForm" style="display: none;">
                        <div id="resetError" class="error-message"></div>
                        <div id="resetSuccess" class="success-message"></div>

                        <div class="form-group">
                            <label for="resetEmail">Email para recuperação</label>
                            <input type="email" id="resetEmail" placeholder="seu@email.com">
                        </div>

                        <button class="btn btn-primary" onclick="handlePasswordReset()">Enviar Link de Recuperação</button>

                        <button class="btn btn-secondary" onclick="toggleRecuperacao()" style="margin-top: 1rem;">← Voltar para Login</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- AULAS SECTION -->
        <div id="aulasSection" class="section">
            <div class="header">
                <div class="header-title">
                    <div class="logo-emoji" id="logoEmoji">🚀</div>
                    <div class="title-text">
                        <h1 id="platformaNome2">Plataforma de Aulas</h1>
                        <p id="userName">Olá, Visitante</p>
                    </div>
                </div>
                <button class="logout-btn" onclick="handleLogout()">🚪 Sair</button>
            </div>

            <div class="courses-grid" id="coursesGrid">
                <!-- Aulas vão aparecer aqui -->
            </div>
        </div>

        <!-- AULA DETAIL SECTION -->
        <div id="aulaDetailSection" class="section">
            <button class="btn btn-back" onclick="backToAulas()">← Voltar às Aulas</button>

            <div class="aula-header">
                <h2 id="aulaTitle">Título da Aula</h2>
                <p id="aulaDescription">Descrição da aula</p>
            </div>

            <div class="video-container" id="videoContainer">
                <!-- Vídeo vai aparecer aqui -->
            </div>

            <div class="rating-section">
                <div class="rating-title">⭐ Avalie esta Aula</div>
                <div class="stars-container" id="starsContainer"></div>
                <p class="rating-text">Sua avaliação nos ajuda a melhorar!</p>
                <div id="ratingDisplay"></div>
            </div>

            <div class="comments-section">
                <div class="comments-title">💬 Comentários e Feedback</div>
                
                <div class="comment-form">
                    <textarea class="comment-textarea" id="commentInput" placeholder="Deixe seu feedback ou comentário..."></textarea>
                    <button class="comment-button" onclick="submitComment()">Enviar Comentário</button>
                </div>

                <div class="comments-list" id="commentsList"></div>
            </div>

            <button class="btn btn-back" onclick="backToAulas()">← Voltar às Aulas</button>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        let currentUser = null;
        let currentAulaId = null;
        let config = null;

        // ===== TOGGLE FORMS =====
        function toggleForm() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const resetForm = document.getElementById('resetForm');

            loginForm.style.display = loginForm.style.display === 'none' ? 'block' : 'none';
            registerForm.style.display = registerForm.style.display === 'none' ? 'block' : 'none';
            resetForm.style.display = 'none';

            // Limpa erros
            document.getElementById('loginError').classList.remove('show');
            document.getElementById('registerError').classList.remove('show');
        }

        function toggleRecuperacao() {
            const loginForm = document.getElementById('loginForm');
            const resetForm = document.getElementById('resetForm');

            loginForm.style.display = loginForm.style.display === 'none' ? 'block' : 'none';
            resetForm.style.display = resetForm.style.display === 'none' ? 'block' : 'none';

            document.getElementById('registerForm').style.display = 'none';
        }

        // ===== LOGIN =====
        async function handleLogin(e) {
            if (e) e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (data.success) {
                    currentUser = data.user;
                    loadAulas();
                } else {
                    showError('loginError', data.error);
                }
            } catch (err) {
                showError('loginError', 'Erro ao conectar');
            }
        }

        // ===== REGISTER =====
        async function handleRegister(e) {
            if (e) e.preventDefault();
            const nome = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const senha = document.getElementById('registerPassword').value;
            const confirmSenha = document.getElementById('registerConfirmPassword').value;

            if (senha !== confirmSenha) {
                showError('registerError', 'Senhas não coincidem!');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ nome, email, senha })
                });

                const data = await response.json();

                if (data.success) {
                    currentUser = data.user;
                    loadAulas();
                } else {
                    showError('registerError', data.error);
                }
            } catch (err) {
                showError('registerError', 'Erro ao registrar');
            }
        }

        // ===== PASSWORD RESET =====
        async function handlePasswordReset(e) {
            if (e) e.preventDefault();
            const email = document.getElementById('resetEmail').value;

            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('resetSuccess', '✓ Email enviado! Verifique sua caixa de entrada para resetar a senha.');
                    document.getElementById('resetEmail').value = '';
                } else {
                    showError('resetError', data.error || 'Email não encontrado');
                }
            } catch (err) {
                showError('resetError', 'Erro ao enviar email. Tente novamente.');
            }
        }

        // ===== LOGOUT =====
        async function handleLogout() {
            await fetch(`${API_URL}/auth/logout`, {
                method: 'POST',
                credentials: 'include'
            });
            location.reload();
        }

        // ===== LOAD AULAS =====
        async function loadAulas() {
            try {
                const sessionResponse = await fetch(`${API_URL}/auth/session`, {
                    credentials: 'include'
                });

                if (sessionResponse.ok) {
                    const session = await sessionResponse.json();
                    currentUser = session.user;

                    const configResponse = await fetch(`${API_URL}/config`);
                    config = await configResponse.json();

                    document.getElementById('logoEmoji').textContent = config.plataforma.logo;
                    document.getElementById('platformaNome2').textContent = config.plataforma.nome;
                    document.getElementById('userName').textContent = `Olá, ${session.user.nome}`;

                    renderAulas();

                    showSection('aulasSection');
                } else {
                    showSection('loginSection');
                }
            } catch (err) {
                console.error('Erro ao carregar aulas:', err);
                showSection('loginSection');
            }
        }

        // ===== RENDER AULAS =====
        function renderAulas() {
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = config.aulas.map(aula => `
                <div class="course-card" onclick="openAula(${aula.id})">
                    <div class="course-image">${aula.emoji}</div>
                    <div class="course-body">
                        <div class="course-title">${aula.titulo}</div>
                        <p class="course-desc">${aula.descricao}</p>
                        <p class="course-meta">${aula.licoes.length} aula${aula.licoes.length > 1 ? 's' : ''} • ${aula.duracao}</p>
                    </div>
                </div>
            `).join('');
        }

        // ===== OPEN AULA =====
        function openAula(aulaId) {
            currentAulaId = aulaId;
            const aula = config.aulas.find(a => a.id === aulaId);

            if (!aula || !aula.licoes || aula.licoes.length === 0) {
                alert('Aula sem conteúdo!');
                return;
            }

            const licao = aula.licoes[0];

            document.getElementById('aulaTitle').textContent = licao.titulo;
            document.getElementById('aulaDescription').textContent = licao.descricao;

            const videoContainer = document.getElementById('videoContainer');
            if (licao.tipo === 'youtube') {
                videoContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${licao.videoId}" frameborder="0" allowfullscreen></iframe>`;
            } else {
                videoContainer.innerHTML = `<video controls><source src="${licao.videoId}" type="video/mp4"></video>`;
            }

            renderStars(aulaId);
            renderComments(aulaId);

            showSection('aulaDetailSection');
        }

        // ===== BACK TO AULAS =====
        function backToAulas() {
            currentAulaId = null;
            showSection('aulasSection');
        }

        // ===== RATINGS =====
        function getRating(aulaId) {
            return localStorage.getItem(`rating_${aulaId}`) || 0;
        }

        function saveRating(aulaId, rating) {
            localStorage.setItem(`rating_${aulaId}`, rating);
            renderStars(aulaId);

            fetch(`${API_URL}/aulas/${aulaId}/rating`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ rating })
            }).catch(err => console.error('Erro ao salvar avaliação:', err));
        }

        function renderStars(aulaId) {
            const container = document.getElementById('starsContainer');
            const currentRating = getRating(aulaId);

            container.innerHTML = Array(5).fill(0).map((_, i) => {
                const starValue = i + 1;
                return `<span class="star ${starValue <= currentRating ? 'active' : ''}" onclick="saveRating(${aulaId}, ${starValue})">★</span>`;
            }).join('');
        }

        // ===== COMMENTS =====
        function getComments(aulaId) {
            return JSON.parse(localStorage.getItem(`comments_${aulaId}`) || '[]');
        }

        function saveComment(aulaId, text) {
            const comments = getComments(aulaId);
            comments.push({
                text,
                timestamp: new Date().toLocaleString('pt-BR')
            });
            localStorage.setItem(`comments_${aulaId}`, JSON.stringify(comments));
            renderComments(aulaId);

            fetch(`${API_URL}/aulas/${aulaId}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ comentario: text })
            }).catch(err => console.error('Erro ao salvar comentário:', err));
        }

        function renderComments(aulaId) {
            const comments = getComments(aulaId);
            const container = document.getElementById('commentsList');

            container.innerHTML = comments.map((comment, index) => `
                <div class="comment-item">
                    <div class="comment-user">Você</div>
                    <div class="comment-text">${comment.text}</div>
                    <div class="comment-time">${comment.timestamp}</div>
                </div>
            `).join('');
        }

        function submitComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();

            if (!text) {
                alert('Escreva um comentário antes de enviar!');
                return;
            }

            saveComment(currentAulaId, text);
            input.value = '';
        }

        // ===== SHOW SECTION =====
        function showSection(sectionId) {
            const sections = document.querySelectorAll('.section');
            sections.forEach(section => section.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }

        // ===== HELPERS =====
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('show');
            setTimeout(() => element.classList.remove('show'), 5000);
        }

        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('show');
            setTimeout(() => element.classList.remove('show'), 5000);
        }

        // ===== INIT =====
        window.addEventListener('load', loadAulas);
    </script>
</body>
</html>
